name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[dev]"
          pip install coverage
      - name: Test suite
        run: pytest -q
      - name: Dogfood — gate the demo
        run: |
          cd examples/demo
          pytest -q
          python -m mutation_gate.cli run . --min-score 0.7 --no-cache
          python -m mutation_gate.cli verify tests/test_real.py .
