[project]
name = "mutation-gate"
version = "0.5.0"
description = "Mutation testing as the verification gate for AI-written tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
mutation-gate = "mutation_gate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutation_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
