name: mutation-gate
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mutation gate (80% minimum)
        uses: ./.github/actions/mutation-gate
        with:
          min-score: 0.8
          project: .
          args: --coverage-guided
          github-token: ${{ secrets.GITHUB_TOKEN }}
